<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>シューティングゲーム</title>

<!-- Firebase（互換モード） -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<script>
// あなたの Firebase 設定値
const firebaseConfig = {
  apiKey: "AIzaSy_DUMMY_KEY_FOR_TEST",
  authDomain: "shootinggame-sample.firebaseapp.com",
  databaseURL: "https://shootinggame-sample-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "shootinggame-sample",
  storageBucket: "shootinggame-sample.firebasestorage.app",
  messagingSenderId: "263223079463",
  appId: "1:263223079463:web:bbf7f24bdecd3bb2b5d402",
  measurementId: "G-ML0M8JS4W8"
};

// Firebase 初期化
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
</script>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    display: flex;
    flex-direction: row;
    color: white;
    font-family: Arial;
  }

  #gameCanvas {
    background: #000;
    border: 2px solid #fff;
    display: block;
  }

  #rankingBox {
    width: 250px;
    padding: 10px;
    border-left: 2px solid white;
    background: #111;
  }

  #rankingBox h2 {
    margin-top: 10px;
    font-size: 24px;
    text-align: center;
  }

  #rankingList {
    margin-top: 20px;
    font-size: 20px;
  }

  #nameInputBox {
    position: absolute;
    top: 40%;
    left: 30%;
    transform: translate(-50%, -50%);
    background: rgba(30, 30, 30, 0.9);
    padding: 20px;
    border: 2px solid white;
    display: none;
    color: white;
    text-align: center;
  }
  #nameInputBox input {
    width: 200px;
    padding: 8px;
    font-size: 18px;
  }
  #nameInputBox button {
    margin-top: 10px;
    padding: 8px 20px;
    font-size: 18px;
  }

  #loadInput {
    display:none;
  }
</style>
</head>
<body>

<canvas id="gameCanvas" width="480" height="640"></canvas>

<div id="rankingBox">
  <h2>ONLINE RANKING</h2>
  <div id="rankingList"></div>

  <hr style="margin:20px 0;">

  <div style="font-size:16px;">
    Dキー：ランキング保存（JSON）<br>
    Lキー：ランキング読み込み（JSON）
  </div>
</div>

<div id="nameInputBox">
  <div style="font-size:20px; margin-bottom:10px;">名前を入力してください</div>
  <input type="text" id="playerName">
  <br>
  <button onclick="submitName()">OK</button>
</div>

<input type="file" id="loadInput">

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// =======================
// 画像読み込み
// =======================
const playerImg = new Image();
playerImg.src = "player.png";

const enemyImg = new Image();
enemyImg.src = "enemy.png";

// プレイヤー設定
const player = {
  x: canvas.width / 2 - 15,
  y: canvas.height - 60,
  width: 30,
  height: 30,
  speed: 5,
  bullets: []
};

const enemies = [];
const enemyBullets = [];
const explosions = [];

const enemySpeed = 2;
const bulletSpeed = 7;
let enemyBulletSpeed = 4;

let score = 0;
let title = true;
let playing = false;
let gameOver = false;
let blink = true;

let Einterval = 60;
let Estimer = 60;

let i = 0;
let j = 0;

setInterval(() => blink = !blink, 500);

// 入力管理
const keys = {};
document.addEventListener("keydown", e => {
  keys[e.code] = true;

  if (title && e.code === "KeyS") startGame();
  if (gameOver && e.code === "KeyR") restartGame();

  if (title) {
    if (e.code === "KeyD") downloadRankingJSON();
    if (e.code === "KeyL") document.getElementById("loadInput").click();
  }
});
document.addEventListener("keyup", e => keys[e.code] = false);

// =======================
// Firebase オンライン保存
// =======================
function saveScoreOnline(name, score) {
  const newRef = db.ref("ranking_d").push();
  newRef.set({
    name: name,
    score: score,
    time: Date.now()
  });
}

// =======================
// Firebase オンラインランキング取得
// =======================
function loadOnlineRanking() {
  db.ref("ranking_d")
    .orderByChild("score")
    .limitToLast(10)
    .on("value", snapshot => {

      const data = [];
      snapshot.forEach(child => {
        data.push(child.val());
      });

      data.sort((a, b) => b.score - a.score);

      const box = document.getElementById("rankingList");
      box.innerHTML = data
        .map((r, i) => `${i + 1}. ${r.name} - ${r.score}`)
        .join("<br>");
    });
}

// 初期読み込み
loadOnlineRanking();

// =======================
// JSON 保存（オフライン用）
// =======================
function downloadRankingJSON() {
  db.ref("ranking_d").once("value", snapshot => {
    const data = snapshot.val() || {};
    const arr = Object.values(data);

    const blob = new Blob([JSON.stringify(arr, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "ranking_d.json";
    a.click();

    URL.revokeObjectURL(url);
  });
}

// =======================
// JSON 読み込み（オフライン用）
// =======================
document.getElementById("loadInput").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function() {
    try {
      const arr = JSON.parse(reader.result);

      arr.forEach(r => {
        saveScoreOnline(r.name, r.score);
      });

      alert("オンラインランキングに読み込みました！");
    } catch {
      alert("読み込みに失敗しました");
    }
  };
  reader.readAsText(file);
});

// =======================
// ゲーム開始・再スタート
// =======================
function startGame() {
  title = false;
  playing = true;
  gameOver = false;

  player.x = canvas.width / 2 - 15;
  player.y = canvas.height - 60;
  player.bullets = [];
  enemies.length = 0;
  enemyBullets.length = 0;
  explosions.length = 0;
  score = 0;
}

function restartGame() {
  title = true;
  playing = true;
  gameOver = false;

  player.x = canvas.width / 2 - 15;
  player.y = canvas.height - 60;
  player.bullets = [];
  enemies.length = 0;
  enemyBullets.length = 0;
  explosions.length = 0;
  score = 0;
  
  Einterval = 60;
  Estimer = 60;
  enemyBulletSpeed = 4;
document.getElementById("nameInputBox").style.display = "none";  
}

// =======================
// プレイヤー弾発射
// =======================
function shootPlayer() {
  player.bullets.push({
    x: player.x + player.width / 2 - 2,
    y: player.y,
    width: 4,
    height: 10
  });
}

// =======================
// 敵生成
// =======================
function spawnEnemy() {
  const size = 30;
  enemies.push({
    x: Math.random() * (canvas.width - size),
    y: -size,
    width: size,
    height: size,
    shootTimer: Math.floor(Math.random() * Estimer) + 60
  });
}

// =======================
// 衝突判定
// =======================
function isColliding(a, b) {
  return a.x < b.x + b.width &&
         a.x + a.width > b.x &&
         a.y < b.y + b.height &&
         a.y + a.height > b.y;
}

// =======================
// 爆発生成
// =======================
function createExplosion(x, y) {
  explosions.push({
    x: x,
    y: y,
    radius: 0,
    maxRadius: 20,
    alpha: 1
  });
}

// =======================
// 更新処理
// =======================
function update() {

  if (title) return;
  if (gameOver) return;

  if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
  if (keys["ArrowRight"] && player.x < canvas.width - player.width) player.x += player.speed;

  if (keys["Space"]) {
    if (player.bullets.length === 0 || player.bullets[player.bullets.length - 1].y < player.y - 50) {
      shootPlayer();
    }
  }

  player.bullets.forEach((b, i) => {
    b.y -= bulletSpeed;
    if (b.y + b.height < 0) player.bullets.splice(i, 1);
  });

  enemies.forEach((e, ei) => {
    e.y += enemySpeed;
    e.shootTimer--;
    if (e.shootTimer <= 0) {
      enemyBullets.push({
        x: e.x + e.width / 2 - 2,
        y: e.y + e.height,
        width: 4,
        height: 10
      });
      e.shootTimer = Math.floor(Math.random() * 60) + 60;
    }
    if (e.y > canvas.height) enemies.splice(ei, 1);
  });

  enemyBullets.forEach((b, i) => {
    b.y += enemyBulletSpeed;
    if (b.y > canvas.height) enemyBullets.splice(i, 1);
  });


i++;

if (i >= Einterval){
        spawnEnemy();
i = 0;

}


  player.bullets.forEach((b, bi) => {
    enemies.forEach((e, ei) => {
      if (isColliding(b, e)) {
        createExplosion(e.x + e.width / 2, e.y + e.height / 2);
        player.bullets.splice(bi, 1);
        enemies.splice(ei, 1);
        score += 10;
        
        j++;
        if (j>5){
           if (Einterval >1){
           Einterval -= 1;
           if (Estimer >1){
           Estimer -=1;
           }
        j = 0;
        }
        if((score>100)&&(score<500)){
        enemyBulletSpeed = 5; 
        }
        if((score>500)&&(score<1000)){
        enemyBulletSpeed = 6; 
        }        
        if((score>1000)&&(score<1500)){
        enemyBulletSpeed = 7; 
        }
        if((score>1500)&&(score<2000)){
        enemyBulletSpeed = 8; 
        }
        
        }
      }
    });
  });

  enemies.forEach(e => {
    if (isColliding(player, e)) {
      gameOver = true;
      showNameInput();
    }
  });

  enemyBullets.forEach(b => {
    if (isColliding(player, b)) {
      gameOver = true;
      showNameInput();
    }
  });

  explosions.forEach((ex, i) => {
    ex.radius += 1.5;
    ex.alpha -= 0.05;
    if (ex.radius >= ex.maxRadius || ex.alpha <= 0) {
      explosions.splice(i, 1);
    }
  });
}

// =======================
// 名前入力 UI 表示
// =======================
function showNameInput() {
  document.getElementById("nameInputBox").style.display = "block";
}

// =======================
// 名前入力 → オンライン保存
// =======================
function submitName() {
  const name = document.getElementById("playerName").value || "NO NAME";

  saveScoreOnline(name, score);

  document.getElementById("nameInputBox").style.display = "none";
}

// =======================
// 描画処理
// =======================
function draw() {

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (title) {
    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.fillText("SHOOTING GAME", 60, 150);

    if (blink) {
      ctx.font = "24px Arial";
      ctx.fillText("Press S to Start", 140, 300);
    }

    return;
  }

  ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);

  ctx.fillStyle = "yellow";
  player.bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

  enemies.forEach(e => ctx.drawImage(enemyImg, e.x, e.y, e.width, e.height));

  ctx.fillStyle = "orange";
  enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

  explosions.forEach(ex => {
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 200, 0, ${ex.alpha})`;
    ctx.fill();
  });

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("SCORE: " + score, 10, 30);

  if (gameOver) {
    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.fillText("GAME OVER", canvas.width / 2 - 120, canvas.height / 2);

    if (blink) {
      ctx.font = "24px Arial";
      ctx.fillText("Press R to Restart", canvas.width / 2 - 110, canvas.height / 2 + 50);
    }
  }
}

// =======================
// メインループ
// =======================
setInterval(() => {
  update();
  draw();
}, 1000 / 60);

//setInterval(spawnEnemy, Einterval);

</script>
</body>
</html>
